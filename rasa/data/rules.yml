version: "3.1"

rules:
  - rule: Say hello
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Answer architecture questions
    steps:
      - intent: ask_architecture
      - action: utter_architecture_response

  - rule: Request additional information
    steps:
      - intent: request_info
      - action: utter_ask_more

  - rule: Answer about microservices
    steps:
      - intent: ask_microservices
      - action: utter_microservices

  - rule: Answer about monolith
    steps:
      - intent: ask_monolith
      - action: utter_monolith

  - rule: Answer about scalability
    steps:
      - intent: ask_scalability
      - action: utter_scalability

  - rule: Answer about best practices
    steps:
      - intent: ask_best_practices
      - action: utter_best_practices

  - rule: Answer about event-driven architecture
    steps:
      - intent: ask_event_driven
      - action: utter_event_driven

