version: "3.1"

nlu:

  - intent: greet
    examples: |
      - Привет
      - Здравствуйте
      - Добрый день
      - Хай
      - Приветствую

  - intent: goodbye
    examples: |
      - До свидания
      - Пока
      - Увидимся
      - Всего доброго
      - Бывай

  - intent: affirm
    examples: |
      - Да
      - Верно
      - Именно
      - Конечно
      - Безусловно

  - intent: deny
    examples: |
      - Нет
      - Не нужно
      - Неверно
      - Не хочу
      - Не интересует

  - intent: request_info
    examples: |
      - Расскажите больше об этом
      - Можете уточнить?
      - Какие есть детали?
      - Хотелось бы подробностей
      - Поясните, пожалуйста

  - intent: ask_architecture
    examples: |
      - Расскажите об архитектуре ПО
      - Какие подходы существуют в архитектуре?
      - Что такое микросервисная архитектура?
      - Как выбрать архитектуру ПО?
      - Какие бывают архитектурные стили?
      - Архитектура ПО — это важно?
      - Как архитектура влияет на масштабируемость?
      - Какие паттерны существуют в архитектуре?

  - intent: ask_microservices
    examples: |
      - Что такое микросервисы?
      - Как работает микросервисная архитектура?
      - Преимущества микросервисов? 
      - Какие проблемы бывают с микросервисами?
      - Подходит ли мне микросервисная архитектура?

  - intent: ask_monolith
    examples: |
      - А что такое монолит?
      - Когда лучше использовать монолит?
      - Монолит проще микросервисов?
      - Какие минусы у монолита?
      - Является ли монолит устаревшим?

  - intent: ask_scalability
    examples: |
      - Как обеспечить масштабируемость?
      - Как архитектура влияет на масштабируемость?
      - Что мешает масштабированию?
      - Масштабирование горизонтальное или вертикальное?
      - Как спроектировать масштабируемую систему?

  - intent: ask_best_practices
    examples: |
      - Какие лучшие практики в архитектуре?
      - Что важно учитывать при проектировании?
      - Расскажите об архитектурных паттернах
      - Какие ошибки часто совершают архитекторы?
      - Как избежать проблем в будущем?

  - intent: ask_event_driven
    examples: |
      - Что такое событийная архитектура?
      - Когда стоит использовать event-driven подход?
      - Как реализовать событийную архитектуру?
      - В чем плюсы и минусы event-driven?
      - Подходит ли event-driven для микросервисов?
